minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=simplemap
mod_name=Simple Map
mod_license=MIT
mod_version=2.0.4.1
mod_group_id=com.velorise.simplemap
mod_authors=Velorise
mod_description=An exploration-driven world map and minimap with accurate terrain colors, persistent layered cave mapping, waypoints, and optional server-side Map Books.
simplemap_build=RELEASE_2_0_0
