name: PASS39 Linux natives

on:
  push:
    branches: [ci/pass39-linux-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-linux-natives:
    runs-on: ubuntu-latest
    steps:
      - name: Download Minecraft 1.21.1 Linux runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-natives
          mc=https://libraries.minecraft.net
          for path in \
            org/lwjgl/lwjgl/3.3.3/lwjgl-3.3.3-natives-linux.jar \
            org/lwjgl/lwjgl-freetype/3.3.3/lwjgl-freetype-3.3.3-natives-linux.jar \
            org/lwjgl/lwjgl-glfw/3.3.3/lwjgl-glfw-3.3.3-natives-linux.jar \
            org/lwjgl/lwjgl-jemalloc/3.3.3/lwjgl-jemalloc-3.3.3-natives-linux.jar \
            org/lwjgl/lwjgl-openal/3.3.3/lwjgl-openal-3.3.3-natives-linux.jar \
            org/lwjgl/lwjgl-opengl/3.3.3/lwjgl-opengl-3.3.3-natives-linux.jar \
            org/lwjgl/lwjgl-stb/3.3.3/lwjgl-stb-3.3.3-natives-linux.jar \
            org/lwjgl/lwjgl-tinyfd/3.3.3/lwjgl-tinyfd-3.3.3-natives-linux.jar; do
            curl -fL --retry 4 "$mc/$path" -o "linux-natives/$(basename "$path")"
          done

          mvn=https://repo1.maven.org/maven2/io/netty/netty-transport-native-epoll/4.1.97.Final
          for file in \
            netty-transport-native-epoll-4.1.97.Final.jar \
            netty-transport-native-epoll-4.1.97.Final.pom \
            netty-transport-native-epoll-4.1.97.Final-linux-x86_64.jar; do
            curl -fL --retry 4 "$mvn/$file" -o "linux-natives/$file"
          done

          sha1sum linux-natives/* | sort > linux-natives/SHA1SUMS.txt
          unzip -t linux-natives/lwjgl-glfw-3.3.3-natives-linux.jar
          unzip -t linux-natives/netty-transport-native-epoll-4.1.97.Final.jar
          ls -lh linux-natives

      - uses: actions/upload-artifact@v4
        with:
          name: pass39-linux-natives
          path: linux-natives
          if-no-files-found: error
          retention-days: 7
